<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード生成ツール</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 2em; }
        .form-group { margin-bottom: 1em; }
        label { display: block; margin-bottom: 0.5em; }
        input[type="text"], input[type="number"] { padding: 0.5em; width: 200px; }
        .result { margin-top: 1.5em; padding: 1em; background-color: #f0f0f0; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>パスワード生成ツール</h1>

    <form id="password-form">
        <div class="form-group">
            <label>使用する文字の種類（複数選択可）:</label>
            <input type="checkbox" id="upper" name="char_types" value="upper" checked>
            <label for="upper">英語（大文字）</label>
            <input type="checkbox" id="lower" name="char_types" value="lower" checked>
            <label for="lower">英語（小文字）</label>
            <input type="checkbox" id="numbers" name="char_types" value="numbers" checked>
            <label for="numbers">数字</label>
            <input type="checkbox" id="symbols" name="char_types" value="symbols" checked>
            <label for="symbols">記号</label>
        </div>

        <div class="form-group">
            <label>文字数:</label>
            <input type="radio" id="len8" name="length_option" value="8" checked>
            <label for="len8">8</label>
            <input type="radio" id="len10" name="length_option" value="10">
            <label for="len10">10</label>
            <input type="radio" id="len12" name="length_option" value="12">
            <label for="len12">12</label>
            <input type="radio" id="len_other" name="length_option" value="other">
            <label for="len_other">その他:</label>
            <input type="number" id="custom_length" name="custom_length" min="4" max="100" value="12" style="width: 60px;">
        </div>

        <div class="form-group">
            <label for="base_word">覚えやすい単語（任意）:</label>
            <input type="text" id="base_word" name="base_word" placeholder="例: Apple">
        </div>

        <button type="submit">パスワードを生成</button>
    </form>

    <div id="result-container" class="result" style="display: none;">
        <h3>生成されたパスワード:</h3>
        <p id="password-output" style="font-weight: bold; font-size: 1.2em;"></p>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
